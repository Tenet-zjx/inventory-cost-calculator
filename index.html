<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;background:linear-gradient(135deg,#f0f4ff 0%,#f8fafc 40%,#fef9f0 100%);color:#1e293b;min-height:100vh}

/* 顶部装饰渐变条 */

/* 必选/可选标签 */

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback, useMemo, useEffect } = React;

/* ========== 增强的列名智能匹配 ========== */
const COL_PATTERNS = {
  initial: {
    skuCode: {
      patterns: ['SKU编码','SKU代码','SKU号','物料编码','物料代码','物料号','商品编码','商品代码','sku编码','sku代码','SKU','skucode','物料编号','存货编码','货号','品号'],
      required: true,
      label: 'SKU编码',
      group: 'basic'
    },
    skuName: {
      patterns: ['SKU名称','物料名称','商品名称','sku名称','品名','名称','存货名称','物料描述','品名规格','货品名称'],
      required: false,
      label: 'SKU名称',
      group: 'basic'
    },
    skuType: {
      patterns: ['SKU类型','物料类型','商品类型','sku类型','类型','存货类别','物料属性','分类','品类'],
      required: false,
      label: 'SKU类型',
      group: 'basic'
    },
    qty: {
      patterns: ['期初数量','期初库存数量','期初数','初数量','初始数量','opening_qty','begin_qty','数量','库存数量','结存数量','期末数量','收货数量','到货数量','入库数量','期初结存数量','初存数量','月初数量'],
      required: true,
      label: '数量',
      group: 'amount'
    },
    price: {
      patterns: ['期初单价','期初库存单价','期初价格','初单价','初始单价','opening_price','begin_price','单价','单位成本','不含税单价','含税单价','成本单价','采购单价','入库单价','标准单价','标准成本','单位价格'],
      required: false,
      label: '单价',
      group: 'amount'
    },
    amount: {
      patterns: ['期初金额','期初库存金额','期初价值','初金额','初始金额','opening_amount','begin_amount','金额','总金额','价税合计','不含税金额','含税金额','成本金额','总价','总计','货款','价税合计金额','总额','期初总金额'],
      required: false,
      label: '金额',
      group: 'amount'
    }
  },
  purchase: {
    skuCode: {
      patterns: ['SKU编码','SKU代码','SKU号','物料编码','物料代码','物料号','商品编码','商品代码','sku编码','sku代码','SKU','skucode','物料编号','存货编码','货号','品号'],
      required: true,
      label: 'SKU编码',
      group: 'basic'
    },
    skuName: {
      patterns: ['SKU名称','物料名称','商品名称','sku名称','品名','名称','存货名称','物料描述','品名规格','货品名称'],
      required: false,
      label: 'SKU名称',
      group: 'basic'
    },
    skuType: {
      patterns: ['SKU类型','物料类型','商品类型','sku类型','类型','存货类别','物料属性','分类','品类'],
      required: false,
      label: 'SKU类型',
      group: 'basic'
    },
    qty: {
      patterns: ['采购数量','采购入库数量','采购数','入库数量','入库数','purchase_qty','采购量','数量','收货数量','到货数量','进货数量','收货量','进货量','订货数量'],
      required: true,
      label: '数量',
      group: 'amount'
    },
    price: {
      patterns: ['采购单价','采购入库单价','采购价格','入库单价','purchase_price','采购价','单价','单位成本','不含税单价','含税单价','成本单价','进价','进货单价','标准单价','标准成本','单位价格'],
      required: false,
      label: '单价',
      group: 'amount'
    },
    amount: {
      patterns: ['采购金额','采购入库金额','采购价值','入库金额','purchase_amount','采购额','金额','总金额','价税合计','不含税金额','含税金额','成本金额','总价','总计','货款','价税合计金额','总额','采购总金额'],
      required: false,
      label: '金额',
      group: 'amount'
    }
  },
  assembly: {
    parentCode: {
      patterns: ['父件SKU','父件编码','父件SKU编码','父件代码','父件物料编码','父件号','父SKU','parent_sku','成品编码','成品SKU','成品代码','产品编码','产品SKU','主件编码','主件SKU'],
      required: true,
      label: '父件编码',
      group: 'parent'
    },
    parentName: {
      patterns: ['父件名称','父件SKU名称','父件品名','父名称','parent_name','成品名称','产品名称','主件名称'],
      required: false,
      label: '父件名称',
      group: 'parent'
    },
    assemblyQty: {
      patterns: ['组装数量','组装入库数量','组装数','装配数量','assembly_qty','组合数量','成品数量','产出数量','生产数量','完工数量'],
      required: true,
      label: '组装数量',
      group: 'parent'
    },
    childCode: {
      patterns: ['子件SKU','子件编码','子件SKU编码','子件代码','子件物料编码','子件号','子SKU','child_sku','原料编码','原料SKU','零件编码','零件SKU','配件编码','配件SKU','组件编码'],
      required: true,
      label: '子件编码',
      group: 'child'
    },
    childName: {
      patterns: ['子件名称','子件SKU名称','子件品名','子名称','child_name','原料名称','零件名称','配件名称','组件名称'],
      required: false,
      label: '子件名称',
      group: 'child'
    },
    unitUsage: {
      patterns: ['单件耗用量','单件用量','单位耗用量','用量','耗用量','BOM用量','unit_usage','单位用量','定额','定额用量','BOM定额','标准用量','单位用量','耗用'],
      required: true,
      label: '单件耗用量',
      group: 'child'
    }
  }
};

// 列组之间的依赖关系：金额组中，price和amount至少需要匹配一个
const GROUP_RULES = {
  initial: { amount: { requireOneOf: ['price', 'amount'], message: '单价和金额至少需要匹配一列（如有单价×数量=金额，如有金额÷数量=单价）' } },
  purchase: { amount: { requireOneOf: ['price', 'amount'], message: '单价和金额至少需要匹配一列（如有单价×数量=金额，如有金额÷数量=单价）' } },
  assembly: {}
};

function matchColumn(headers, patterns) {
  const result = {};
  const used = new Set();
  for (const key of Object.keys(patterns)) {
    const pats = patterns[key].patterns;
    // 精确匹配
    for (const pat of pats) {
      const idx = headers.findIndex((h, i) => !used.has(i) && h && h.toString().trim().replace(/\s+/g,'') === pat.replace(/\s+/g,''));
      if (idx !== -1) { result[key] = idx; used.add(idx); break; }
    }
    if (result[key] === undefined) {
      // 包含匹配
      for (const pat of pats) {
        const idx = headers.findIndex((h, i) => !used.has(i) && h && h.toString().trim().includes(pat.replace(/\s+/g,'')));
        if (idx !== -1) { result[key] = idx; used.add(idx); break; }
      }
    }
  }
  return result;
}

// 验证列映射是否满足要求
function validateMapping(colMap, tableType) {
  const patterns = COL_PATTERNS[tableType];
  const issues = [];
  const missing = {};

  // 检查必选字段
  for (const key of Object.keys(patterns)) {
    if (patterns[key].required && colMap[key] === undefined) {
      issues.push({ key, label: patterns[key].label, severity: 'error', message: `必选字段"${patterns[key].label}"未匹配` });
      missing[key] = true;
    }
  }

  // 检查组规则（单价/金额二选一）
  const rules = GROUP_RULES[tableType];
  for (const [group, rule] of Object.entries(rules || {})) {
    if (rule.requireOneOf) {
      const anyMatched = rule.requireOneOf.some(k => colMap[k] !== undefined);
      if (!anyMatched) {
        issues.push({ key: group, label: rule.requireOneOf.map(k => patterns[k].label).join('/'), severity: 'warning', message: rule.message });
        rule.requireOneOf.forEach(k => { if (colMap[k] === undefined) missing[k] = true; });
      }
    }
  }

  return { issues, missing };
}

function parseSheet(workbook, sheetName) {
  const ws = workbook.Sheets[sheetName];
  if (!ws) return { headers: [], rows: [] };
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
  if (raw.length < 2) return { headers: [], rows: [] };
  const headers = raw[0].map(h => h ? h.toString().trim() : '');
  const rows = raw.slice(1).filter(r => r.some(c => c !== '' && c !== null && c !== undefined));
  return { headers, rows };
}

function numVal(v) {
  if (v === null || v === undefined || v === '') return 0;
  const n = Number(v);
  return isNaN(n) ? 0 : n;
}

/* ========== 单文件上传区域组件 ========== */
const UploadZone = ({ tableType, zoneClass, icon, title, subtitle, data, onFileLoaded, onRemove, gradientBg, accentColor }) => {
  const [dragOver, setDragOver] = useState(false);
  const inputRef = useRef(null);

  const handleFile = useCallback((file) => {
    if (!/\.(xlsx|xls)$/i.test(file.name)) {
      alert(`${file.name}: 不支持的格式，请上传 .xlsx 或 .xls 文件`);
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'array' });
        // 自动识别sheet
        let targetSheet = null;
        const sheetNames = wb.SheetNames;
        const keywordMap = {
          initial: /期初|初始|opening|initial|begin/i,
          purchase: /采购|purchase|buy|procure/i,
          assembly: /组装|装配|assembly|bom|组合/i
        };
        for (const sn of sheetNames) {
          if (keywordMap[tableType].test(sn)) { targetSheet = sn; break; }
        }
        if (!targetSheet) {
          // 尝试通过列头检测
          for (const sn of sheetNames) {
            const { headers } = parseSheet(wb, sn);
            const headerStr = headers.join(' ');
            if (tableType === 'initial' && /期初|opening/i.test(headerStr)) { targetSheet = sn; break; }
            if (tableType === 'purchase' && /采购|purchase/i.test(headerStr)) { targetSheet = sn; break; }
            if (tableType === 'assembly' && /组装|子件|父件|assembly/i.test(headerStr)) { targetSheet = sn; break; }
          }
        }
        if (!targetSheet) targetSheet = sheetNames[0];

        const { headers, rows } = parseSheet(wb, targetSheet);
        const colMap = matchColumn(headers, COL_PATTERNS[tableType]);
        const validation = validateMapping(colMap, tableType);
        onFileLoaded({ headers, rows, colMap, sheetName: targetSheet, fileName: file.name, validation });
      } catch (err) {
        alert(`${file.name}: 解析失败 - ${err.message}`);
      }
    };
    reader.readAsArrayBuffer(file);
  }, [tableType, onFileLoaded]);

  const onDrop = useCallback((e) => {
    e.preventDefault();
    setDragOver(false);
    const files = e.dataTransfer.files;
    if (files.length > 0) handleFile(files[0]);
  }, [handleFile]);

  const onDragOver = useCallback((e) => {
    e.preventDefault();
    setDragOver(true);
  }, []);

  const onDragLeave = useCallback((e) => {
    setDragOver(false);
  }, []);

  const onChange = useCallback((e) => {
    const files = e.target.files;
    if (files.length > 0) handleFile(files[0]);
    e.target.value = '';
  }, [handleFile]);

  const patterns = COL_PATTERNS[tableType];
  const validation = data ? data.validation : null;

  return (
    <div
      className={`upload-zone ${zoneClass} ${dragOver ? 'drag-over' : ''} ${data ? 'has-file' : ''} bg-white card-shadow-lg cursor-pointer transition-all duration-300`}
      onDrop={onDrop}
      onDragOver={onDragOver}
      onDragLeave={onDragLeave}
      onClick={() => !data && inputRef.current.click()}
    >
      <input ref={inputRef} type="file" accept=".xlsx,.xls" className="hidden" onChange={onChange}/>

      {/* 标题栏 */}
      <div className={`px-5 py-3 flex items-center justify-between ${gradientBg} rounded-t-xl`}>
        <div className="flex items-center gap-2.5">
          <span className="text-xl">{icon}</span>
          <div>
            <h3 className="font-bold text-white text-sm">{title}</h3>
            <p className="text-xs text-white/70">{subtitle}</p>
          </div>
        </div>
        {data && (
          <span className="text-xs bg-white/20 text-white px-2.5 py-1 rounded-full font-medium backdrop-blur-sm">
            {data.rows.length} 行数据
          </span>
        )}
      </div>

      <div className="p-5">
        {!data ? (
          /* 空状态 - 上传提示 */
          <div className="flex flex-col items-center gap-3 py-6">
            <div className={`w-14 h-14 rounded-2xl flex items-center justify-center ${gradientBg} shadow-lg`}>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
            </div>
            <div className="text-center">
              <p className="text-slate-600 font-medium text-sm">拖拽文件到此处，或点击选择</p>
              <p className="text-xs text-slate-400 mt-1">支持 .xlsx / .xls，限1个文件</p>
            </div>
          </div>
        ) : (
          /* 已上传状态 - 显示详情 */
          <div className="space-y-3 fade-in">
            {/* 文件信息 */}
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2 text-xs text-slate-500">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span className="font-medium text-slate-600">{data.fileName}</span>
                <span className="text-slate-400">→</span>
                <span>工作表: {data.sheetName}</span>
              </div>
              <button
                onClick={(e) => { e.stopPropagation(); onRemove(); }}
                className="remove-btn w-6 h-6 flex items-center justify-center rounded-full text-red-400 hover:text-red-600"
                title="移除文件"
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>

            {/* 列映射结果 */}
            <div className="bg-slate-50/80 rounded-xl p-3">
              <div className="flex items-center justify-between mb-2">
                <span className="text-xs font-semibold text-slate-600">列映射结果</span>
                <div className="flex items-center gap-2">
                  <span className="field-required text-[10px] px-1.5 py-0.5 rounded font-medium">必选</span>
                  <span className="field-optional text-[10px] px-1.5 py-0.5 rounded font-medium">可选</span>
                </div>
              </div>
              <div className="space-y-1.5">
                {Object.keys(patterns).map(key => {
                  const def = patterns[key];
                  const colIdx = data.colMap[key];
                  const isMapped = colIdx !== undefined;
                  const isReq = def.required;
                  const isGroupRuleMissing = validation && validation.missing[key];

                  let statusIcon, statusColor;
                  if (isMapped) {
                    statusIcon = '✓';
                    statusColor = 'map-ok';
                  } else if (isReq || isGroupRuleMissing) {
                    statusIcon = '✗';
                    statusColor = isReq ? 'map-missing-required' : 'map-missing-optional';
                  } else {
                    statusIcon = '—';
                    statusColor = 'map-missing-optional';
                  }

                  return (
                    <div key={key} className="flex items-center gap-2 text-xs">
                      <span className={`font-bold ${statusColor}`}>{statusIcon}</span>
                      <span className={`px-1.5 py-0.5 rounded text-[10px] font-medium ${isReq ? 'field-required' : 'field-optional'}`}>
                        {isReq ? '必选' : '可选'}
                      </span>
                      <span className="text-slate-500 w-20 truncate">{def.label}</span>
                      {isMapped ? (
                        <>
                          <span className="text-slate-400">→</span>
                          <span className="font-medium text-slate-700 bg-white px-2 py-0.5 rounded shadow-sm border border-slate-200">{data.headers[colIdx]}</span>
                        </>
                      ) : (
                        <span className="text-slate-300 italic">未匹配</span>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* 验证提示 */}
            {validation && validation.issues.length > 0 && (
              <div className="space-y-1.5">
                {validation.issues.map((issue, i) => (
                  <div key={i} className={`flex items-start gap-1.5 text-xs px-3 py-2 rounded-lg ${issue.severity === 'error' ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-amber-50 text-amber-600 border border-amber-100'}`}>
                    <span>{issue.severity === 'error' ? '⛔' : '⚠️'}</span>
                    <span>{issue.message}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
};

/* ========== SVG 图表组件 ========== */
const BarChart = ({ data, width, height, title }) => {
  if (!data || data.length === 0) return null;
  const margin = { top: 30, right: 20, bottom: 60, left: 70 };
  const cw = width - margin.left - margin.right;
  const ch = height - margin.top - margin.bottom;
  const maxVal = Math.max(...data.map(d => d.initial + d.purchase + d.assembly), 1);
  const barW = Math.min(30, (cw / data.length) * 0.7);
  const gap = cw / data.length;

  const colors = { initial: '#93c5fd', purchase: '#3b82f6', assembly: '#1e40af' };

  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`}>
      <defs>
        <linearGradient id="barInit" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#93c5fd"/><stop offset="100%" stopColor="#bfdbfe"/>
        </linearGradient>
        <linearGradient id="barPurch" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#3b82f6"/><stop offset="100%" stopColor="#60a5fa"/>
        </linearGradient>
        <linearGradient id="barAsm" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#1e40af"/><stop offset="100%" stopColor="#2563eb"/>
        </linearGradient>
      </defs>
      <text x={width/2} y={18} textAnchor="middle" fontSize={13} fontWeight={600} fill="#334155">{title}</text>
      {data.map((d, i) => {
        const x = margin.left + i * gap + gap/2 - barW/2;
        const hI = (d.initial / maxVal) * ch;
        const hP = (d.purchase / maxVal) * ch;
        const hA = (d.assembly / maxVal) * ch;
        const baseY = margin.top + ch;
        return (
          <g key={i}>
            <rect x={x} y={baseY - hI - hP - hA} width={barW} height={hA} fill="url(#barAsm)" rx={2}/>
            <rect x={x} y={baseY - hI - hP} width={barW} height={hP} fill="url(#barPurch)" rx={2}/>
            <rect x={x} y={baseY - hI} width={barW} height={hI} fill="url(#barInit)" rx={2}/>
            <text x={x + barW/2} y={baseY + 14} textAnchor="middle" fontSize={8} fill="#64748b" transform={`rotate(-45,${x+barW/2},${baseY+14})`}>{d.label.length > 8 ? d.label.slice(0,8)+'…' : d.label}</text>
          </g>
        );
      })}
      {[0, 0.25, 0.5, 0.75, 1].map((p, i) => {
        const y = margin.top + ch * (1 - p);
        const val = maxVal * p;
        return (
          <g key={i}>
            <line x1={margin.left} y1={y} x2={margin.left+cw} y2={y} stroke="#e2e8f0" strokeDasharray={i===0?"":"3,3"}/>
            <text x={margin.left-6} y={y+4} textAnchor="end" fontSize={9} fill="#94a3b8">{val >= 10000 ? (val/10000).toFixed(1)+'万' : val.toFixed(0)}</text>
          </g>
        );
      })}
      <line x1={margin.left} y1={margin.top+ch} x2={margin.left+cw} y2={margin.top+ch} stroke="#cbd5e1"/>
      <line x1={margin.left} y1={margin.top} x2={margin.left} y2={margin.top+ch} stroke="#cbd5e1"/>
    </svg>
  );
};

const DonutChart = ({ data, width, height, title }) => {
  if (!data || data.length === 0) return null;
  const cx = width / 2, cy = height / 2 + 10;
  const outerR = Math.min(width, height) / 2 - 30;
  const innerR = outerR * 0.55;
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const colors = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];

  let startAngle = -Math.PI / 2;
  const slices = data.map((d, i) => {
    const angle = (d.value / total) * 2 * Math.PI;
    const slice = { ...d, startAngle, endAngle: startAngle + angle, color: colors[i % colors.length], pct: ((d.value / total) * 100).toFixed(1) };
    startAngle += angle;
    return slice;
  });

  const arc = (s, e, r) => {
    const large = e - s > Math.PI ? 1 : 0;
    return `M${cx+r*Math.cos(s)},${cy+r*Math.sin(s)} A${r},${r} 0 ${large} 1 ${cx+r*Math.cos(e)},${cy+r*Math.sin(e)}`;
  };

  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`}>
      <text x={width/2} y={18} textAnchor="middle" fontSize={13} fontWeight={600} fill="#334155">{title}</text>
      {slices.map((sl, i) => {
        const path = arc(sl.startAngle, sl.endAngle, outerR) + ' L' + `${cx+innerR*Math.cos(sl.endAngle)},${cy+innerR*Math.sin(sl.endAngle)}` + ` A${innerR},${innerR} 0 ${sl.endAngle-sl.startAngle>Math.PI?1:0} 0 ${cx+innerR*Math.cos(sl.startAngle)},${cy+innerR*Math.sin(sl.startAngle)}` + ' Z';
        return <path key={i} d={path} fill={sl.color} opacity={0.9}/>;
      })}
      <text x={cx} y={cy-6} textAnchor="middle" fontSize={14} fontWeight={700} fill="#1e293b">{total >= 10000 ? (total/10000).toFixed(1)+'万' : total.toFixed(0)}</text>
      <text x={cx} y={cy+10} textAnchor="middle" fontSize={9} fill="#94a3b8">合计金额</text>
      {slices.map((sl, i) => (
        <g key={i}>
          <rect x={i < 3 ? 10 : width - 110} y={height - 50 + (i%3)*16} width={10} height={10} fill={sl.color} rx={2}/>
          <text x={i < 3 ? 24 : width - 96} y={height - 42 + (i%3)*16} fontSize={10} fill="#475569">{sl.label} {sl.pct}%</text>
        </g>
      ))}
    </svg>
  );
};

const HBarChart = ({ data, width, height, title }) => {
  if (!data || data.length === 0) return null;
  const margin = { top: 30, right: 30, bottom: 10, left: 100 };
  const cw = width - margin.left - margin.right;
  const ch = height - margin.top - margin.bottom;
  const maxVal = Math.max(...data.map(d => d.value), 1);
  const barH = Math.min(16, (ch / data.length) * 0.75);
  const gap = ch / data.length;

  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`}>
      <defs>
        <linearGradient id="hbar1" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor="#2563eb"/><stop offset="100%" stopColor="#3b82f6"/>
        </linearGradient>
        <linearGradient id="hbar2" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor="#3b82f6"/><stop offset="100%" stopColor="#60a5fa"/>
        </linearGradient>
        <linearGradient id="hbar3" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor="#93c5fd"/><stop offset="100%" stopColor="#bfdbfe"/>
        </linearGradient>
      </defs>
      <text x={width/2} y={18} textAnchor="middle" fontSize={13} fontWeight={600} fill="#334155">{title}</text>
      {data.map((d, i) => {
        const y = margin.top + i * gap + gap/2 - barH/2;
        const bw = (d.value / maxVal) * cw;
        const grad = i < 3 ? 'url(#hbar1)' : i < 10 ? 'url(#hbar2)' : 'url(#hbar3)';
        return (
          <g key={i}>
            <text x={margin.left - 6} y={y + barH/2 + 4} textAnchor="end" fontSize={9} fill="#475569">{d.label.length > 10 ? d.label.slice(0,10)+'…' : d.label}</text>
            <rect x={margin.left} y={y} width={bw} height={barH} fill={grad} rx={3}/>
            <text x={margin.left + bw + 6} y={y + barH/2 + 4} fontSize={9} fill="#64748b">{d.value.toFixed(2)}</text>
          </g>
        );
      })}
    </svg>
  );
};

/* ========== 主应用 ========== */
const App = () => {
  const [initialData, setInitialData] = useState(null);
  const [purchaseData, setPurchaseData] = useState(null);
  const [assemblyData, setAssemblyData] = useState(null);
  const [results, setResults] = useState(null);
  const [activeTab, setActiveTab] = useState('upload');
  const [processing, setProcessing] = useState(false);
  const [errors, setErrors] = useState([]);

  const handleFileLoaded = useCallback((tableType) => (data) => {
    if (tableType === 'initial') setInitialData(data);
    else if (tableType === 'purchase') setPurchaseData(data);
    else if (tableType === 'assembly') setAssemblyData(data);
  }, []);

  const handleRemove = useCallback((tableType) => () => {
    if (tableType === 'initial') setInitialData(null);
    else if (tableType === 'purchase') setPurchaseData(null);
    else if (tableType === 'assembly') setAssemblyData(null);
  }, []);

  // 检查是否可以计算
  const canCalculate = useMemo(() => {
    if (!initialData || !purchaseData) return false;
    // 检查必选字段是否都已匹配
    const initVal = validateMapping(initialData.colMap, 'initial');
    const purchVal = validateMapping(purchaseData.colMap, 'purchase');
    const hasInitError = initVal.issues.some(i => i.severity === 'error');
    const hasPurchError = purchVal.issues.some(i => i.severity === 'error');
    // 还需要至少有price或amount
    const initHasPriceOrAmount = initialData.colMap.price !== undefined || initialData.colMap.amount !== undefined;
    const purchHasPriceOrAmount = purchaseData.colMap.price !== undefined || purchaseData.colMap.amount !== undefined;
    return !hasInitError && !hasPurchError && initHasPriceOrAmount && purchHasPriceOrAmount;
  }, [initialData, purchaseData]);

  const calculate = useCallback(() => {
    if (!initialData || !purchaseData) {
      setErrors(['请至少上传期初库存和采购入库数据']);
      return;
    }
    setProcessing(true);
    setErrors([]);

    setTimeout(() => {
      try {
        // 辅助函数：根据列映射获取金额和单价
        const getQtyAndAmount = (row, colMap, qtyKey = 'qty', priceKey = 'price', amountKey = 'amount') => {
          const qty = numVal(row[colMap[qtyKey]]);
          const price = colMap[priceKey] !== undefined ? numVal(row[colMap[priceKey]]) : 0;
          const amount = colMap[amountKey] !== undefined ? numVal(row[colMap[amountKey]]) : 0;
          // 优先使用金额列，如果金额列未匹配则用单价×数量
          let finalAmount;
          if (colMap[amountKey] !== undefined && amount !== 0) {
            finalAmount = amount;
          } else if (colMap[priceKey] !== undefined && price !== 0) {
            finalAmount = qty * price;
          } else {
            finalAmount = amount || qty * price;
          }
          return { qty, price, amount: finalAmount };
        };

        // Build initial inventory map
        const initMap = {};
        initialData.rows.forEach(row => {
          const code = row[initialData.colMap.skuCode] || '';
          if (!code) return;
          const name = initialData.colMap.skuName !== undefined ? (row[initialData.colMap.skuName] || '') : '';
          const type = initialData.colMap.skuType !== undefined ? (row[initialData.colMap.skuType] || '').toString().trim() : '';
          const { qty, amount } = getQtyAndAmount(row, initialData.colMap);
          if (!initMap[code]) {
            initMap[code] = { code, name, type, initQty: 0, initAmount: 0 };
          }
          initMap[code].initQty += qty;
          initMap[code].initAmount += amount;
        });

        // Build purchase map
        const purchMap = {};
        purchaseData.rows.forEach(row => {
          const code = row[purchaseData.colMap.skuCode] || '';
          if (!code) return;
          const name = purchaseData.colMap.skuName !== undefined ? (row[purchaseData.colMap.skuName] || '') : '';
          const type = purchaseData.colMap.skuType !== undefined ? (row[purchaseData.colMap.skuType] || '').toString().trim() : '';
          const { qty, amount } = getQtyAndAmount(row, purchaseData.colMap);
          if (!purchMap[code]) {
            purchMap[code] = { code, name, type, purchQty: 0, purchAmount: 0 };
          }
          purchMap[code].purchQty += qty;
          purchMap[code].purchAmount += amount;
        });

        // Build assembly data
        const assemblyMap = {};
        const parentChildRelation = {};
        if (assemblyData && assemblyData.colMap.parentCode !== undefined) {
          assemblyData.rows.forEach(row => {
            const parentCode = row[assemblyData.colMap.parentCode] || '';
            const parentName = assemblyData.colMap.parentName !== undefined ? (row[assemblyData.colMap.parentName] || '') : '';
            const assemblyQty = numVal(row[assemblyData.colMap.assemblyQty]);
            const childCode = row[assemblyData.colMap.childCode] || '';
            const childName = assemblyData.colMap.childName !== undefined ? (row[assemblyData.colMap.childName] || '') : '';
            const unitUsage = numVal(row[assemblyData.colMap.unitUsage]);
            if (!parentCode) return;
            if (!assemblyMap[parentCode]) {
              assemblyMap[parentCode] = { code: parentCode, name: parentName, totalQty: 0, children: [] };
            }
            assemblyMap[parentCode].totalQty += assemblyQty;
            if (childCode) {
              assemblyMap[parentCode].children.push({ childCode, childName, unitUsage });
              if (!parentChildRelation[parentCode]) parentChildRelation[parentCode] = [];
              parentChildRelation[parentCode].push({ childCode, unitUsage });
            }
          });
        }

        // Merge all SKUs
        const allCodes = new Set([...Object.keys(initMap), ...Object.keys(purchMap), ...Object.keys(assemblyMap)]);

        // Determine SKU type
        const parentCodes = new Set(Object.keys(assemblyMap));
        const skuInfo = {};
        allCodes.forEach(code => {
          const isParent = parentCodes.has(code);
          let type = '';
          if (initMap[code]) type = initMap[code].type;
          else if (purchMap[code]) type = purchMap[code].type;
          if (!type) type = isParent ? '父件' : '子件';
          if (isParent) type = '父件';
          const name = (initMap[code] && initMap[code].name) || (purchMap[code] && purchMap[code].name) || (assemblyMap[code] && assemblyMap[code].name) || code;
          skuInfo[code] = { code, name, type };
        });

        // Step 1: Calculate child weighted average price
        const weightedPrice = {};
        const childCodes = [...allCodes].filter(c => skuInfo[c].type !== '父件');
        childCodes.forEach(code => {
          const initQty = initMap[code] ? initMap[code].initQty : 0;
          const initAmount = initMap[code] ? initMap[code].initAmount : 0;
          const purchQty = purchMap[code] ? purchMap[code].purchQty : 0;
          const purchAmount = purchMap[code] ? purchMap[code].purchAmount : 0;
          const totalQty = initQty + purchQty;
          const totalAmount = initAmount + purchAmount;
          weightedPrice[code] = totalQty > 0 ? totalAmount / totalQty : 0;
        });

        // Step 2: Calculate parent weighted average price
        const parentResultData = {};
        parentCodes.forEach(parentCode => {
          const initQty = initMap[parentCode] ? initMap[parentCode].initQty : 0;
          const initAmount = initMap[parentCode] ? initMap[parentCode].initAmount : 0;
          const purchQty = purchMap[parentCode] ? purchMap[parentCode].purchQty : 0;
          const purchAmount = purchMap[parentCode] ? purchMap[parentCode].purchAmount : 0;

          const asm = assemblyMap[parentCode];
          const totalAssemblyQty = asm ? asm.totalQty : 0;
          let assemblyAmount = 0;
          if (asm && asm.children.length > 0) {
            const childUsageMap = {};
            asm.children.forEach(c => {
              if (!childUsageMap[c.childCode]) childUsageMap[c.childCode] = 0;
              childUsageMap[c.childCode] += c.unitUsage;
            });
            let sumCost = 0;
            Object.entries(childUsageMap).forEach(([childCode, usage]) => {
              const childPrice = weightedPrice[childCode] || 0;
              sumCost += childPrice * usage;
            });
            assemblyAmount = totalAssemblyQty * sumCost;
          }

          const totalQty = initQty + purchQty + totalAssemblyQty;
          const totalAmount = initAmount + purchAmount + assemblyAmount;
          const wp = totalQty > 0 ? totalAmount / totalQty : 0;
          weightedPrice[parentCode] = wp;

          parentResultData[parentCode] = {
            initQty, initAmount, purchQty, purchAmount,
            assemblyQty: totalAssemblyQty, assemblyAmount,
            totalQty, totalAmount, weightedPrice: wp
          };
        });

        // Build full result list
        const resultList = [];
        allCodes.forEach(code => {
          const info = skuInfo[code];
          const initQty = initMap[code] ? initMap[code].initQty : 0;
          const initAmount = initMap[code] ? initMap[code].initAmount : 0;
          const purchQty = purchMap[code] ? purchMap[code].purchQty : 0;
          const purchAmount = purchMap[code] ? purchMap[code].purchAmount : 0;
          const isParent = parentCodes.has(code);
          const assemblyQty = isParent ? (parentResultData[code] ? parentResultData[code].assemblyQty : 0) : 0;
          const assemblyAmount = isParent ? (parentResultData[code] ? parentResultData[code].assemblyAmount : 0) : 0;
          const totalQty = initQty + purchQty + assemblyQty;
          const totalAmount = initAmount + purchAmount + assemblyAmount;
          resultList.push({
            code, name: info.name, type: info.type,
            initQty, initAmount, purchQty, purchAmount,
            assemblyQty, assemblyAmount,
            totalQty, totalAmount,
            weightedPrice: weightedPrice[code] || 0
          });
        });

        resultList.sort((a, b) => a.code.localeCompare(b.code));
        setResults(resultList);
        setActiveTab('results');
      } catch (err) {
        setErrors([`计算失败: ${err.message}`]);
      }
      setProcessing(false);
    }, 100);
  }, [initialData, purchaseData, assemblyData]);

  const exportExcel = useCallback(() => {
    if (!results) return;
    const wsData = [
      ['SKU编码', 'SKU名称', 'SKU类型', '期初数量', '期初金额', '采购数量', '采购金额', '组装数量', '组装金额', '期末总数量', '期末总金额', '加权平均单价'],
      ...results.map(r => [r.code, r.name, r.type, r.initQty, r.initAmount, r.purchQty, r.purchAmount, r.assemblyQty, r.assemblyAmount, r.totalQty, r.totalAmount, r.weightedPrice])
    ];
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    ws['!cols'] = [{wch:15},{wch:20},{wch:8},{wch:12},{wch:14},{wch:12},{wch:14},{wch:12},{wch:14},{wch:12},{wch:14},{wch:14}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '期末库存加权平均单价');
    XLSX.writeFile(wb, '期末库存加权平均单价.xlsx');
  }, [results]);

  const stats = useMemo(() => {
    if (!results) return null;
    const childResults = results.filter(r => r.type !== '父件');
    const parentResults = results.filter(r => r.type === '父件');
    const totalInit = results.reduce((s, r) => s + r.initAmount, 0);
    const totalPurch = results.reduce((s, r) => s + r.purchAmount, 0);
    const totalAssembly = results.reduce((s, r) => s + r.assemblyAmount, 0);
    const totalAmount = results.reduce((s, r) => s + r.totalAmount, 0);
    const childAmount = childResults.reduce((s, r) => s + r.totalAmount, 0);
    const parentAmount = parentResults.reduce((s, r) => s + r.totalAmount, 0);
    return {
      totalSKU: results.length,
      childCount: childResults.length,
      parentCount: parentResults.length,
      totalInit, totalPurch, totalAssembly, totalAmount,
      childAmount, parentAmount,
      avgPrice: results.length > 0 ? results.reduce((s, r) => s + r.weightedPrice, 0) / results.length : 0
    };
  }, [results]);

  const barChartData = useMemo(() => {
    if (!results) return [];
    return results
      .sort((a, b) => (b.initAmount + b.purchAmount + b.assemblyAmount) - (a.initAmount + a.purchAmount + a.assemblyAmount))
      .slice(0, 20)
      .map(r => ({ label: r.name || r.code, initial: r.initAmount, purchase: r.purchAmount, assembly: r.assemblyAmount }));
  }, [results]);

  const donutData = useMemo(() => {
    if (!stats) return [];
    return [
      { label: '子件金额', value: stats.childAmount },
      { label: '父件金额', value: stats.parentAmount }
    ];
  }, [stats]);

  const rankData = useMemo(() => {
    if (!results) return [];
    return results
      .sort((a, b) => b.weightedPrice - a.weightedPrice)
      .slice(0, 20)
      .map(r => ({ label: r.name || r.code, value: r.weightedPrice }));
  }, [results]);

  const formatNum = (n) => {
    if (Math.abs(n) >= 10000) return (n / 10000).toFixed(2) + '万';
    return n.toFixed(2);
  };

  const formatMoney = (n) => n.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  return (
    <div className="min-h-screen" style={{background:'linear-gradient(135deg,#f0f4ff 0%,#f8fafc 40%,#fef9f0 100%)'}}>
      {/* 顶部装饰渐变条 */}
      <div className="top-gradient-bar"></div>

      {/* Header */}
      <header className="bg-white/80 backdrop-blur-md border-b border-slate-200/60 card-shadow sticky top-0 z-50">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-xl flex items-center justify-center" style={{background:'linear-gradient(135deg,#3b82f6,#8b5cf6)'}}>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            </div>
            <div>
              <h1 className="text-lg font-bold text-slate-800">库存加权平均单价计算器</h1>
              <p className="text-xs text-slate-400">月末一次加权平均法 · 先算子件再算父件</p>
            </div>
          </div>
          <div className="flex gap-2">
            <button onClick={() => setActiveTab('upload')} className={`px-5 py-2.5 rounded-xl text-sm font-semibold transition-all duration-200 ${activeTab === 'upload' ? 'text-white shadow-lg shadow-blue-200' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`} style={activeTab === 'upload' ? {background:'linear-gradient(135deg,#3b82f6,#2563eb)'} : {}}>
              📥 数据导入
            </button>
            <button onClick={() => results && setActiveTab('results')} className={`px-5 py-2.5 rounded-xl text-sm font-semibold transition-all duration-200 ${activeTab === 'results' ? 'text-white shadow-lg shadow-blue-200' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'} ${!results ? 'opacity-50 cursor-not-allowed' : ''}`} style={activeTab === 'results' ? {background:'linear-gradient(135deg,#3b82f6,#2563eb)'} : {}}>
              📊 计算结果
            </button>
          </div>
        </div>

      <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6">
        {errors.length > 0 && (
          <div className="mb-4 bg-red-50 border border-red-200 rounded-xl p-4 fade-in">
            {errors.map((err, i) => <p key={i} className="text-red-600 text-sm">⛔ {err}</p>)}
            <button onClick={() => setErrors([])} className="mt-2 text-xs text-red-400 hover:text-red-600">关闭</button>
          </div>
        )}

        {activeTab === 'upload' && (
          <div className="fade-in space-y-6">
            {/* 三个分区域上传 */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
              <UploadZone
                tableType="initial"
                zoneClass="zone-initial"
                icon="📦"
                title="期初库存表"
                subtitle="上传期初库存数量与金额"
                data={initialData}
                onFileLoaded={handleFileLoaded('initial')}
                onRemove={handleRemove('initial')}
                gradientBg="bg-gradient-to-r from-blue-500 to-cyan-500"
                accentColor="blue"
              />
              <UploadZone
                tableType="purchase"
                zoneClass="zone-purchase"
                icon="🛒"
                title="采购入库表"
                subtitle="上传采购入库数量与金额"
                data={purchaseData}
                onFileLoaded={handleFileLoaded('purchase')}
                onRemove={handleRemove('purchase')}
                gradientBg="bg-gradient-to-r from-emerald-500 to-teal-500"
                accentColor="green"
              />
              <UploadZone
                tableType="assembly"
                zoneClass="zone-assembly"
                icon="🔧"
                title="组装入库表"
                subtitle="上传组装BOM与入库数量"
                data={assemblyData}
                onFileLoaded={handleFileLoaded('assembly')}
                onRemove={handleRemove('assembly')}
                gradientBg="bg-gradient-to-r from-amber-500 to-orange-500"
                accentColor="amber"
              />
            </div>

            {/* 数据总览提示 */}
            <div className="flex items-center justify-center gap-6 text-sm">
              <div className="flex items-center gap-2">
                <span className={`w-3 h-3 rounded-full ${initialData ? 'bg-green-400 shadow-sm shadow-green-200' : 'bg-slate-200'}`}></span>
                <span className={initialData ? 'text-green-700 font-medium' : 'text-slate-400'}>期初库存 {initialData ? '✓' : '待上传'}</span>
              </div>
              <div className="flex items-center gap-2">
                <span className={`w-3 h-3 rounded-full ${purchaseData ? 'bg-green-400 shadow-sm shadow-green-200' : 'bg-slate-200'}`}></span>
                <span className={purchaseData ? 'text-green-700 font-medium' : 'text-slate-400'}>采购入库 {purchaseData ? '✓' : '待上传'}</span>
              </div>
              <div className="flex items-center gap-2">
                <span className={`w-3 h-3 rounded-full ${assemblyData ? 'bg-green-400 shadow-sm shadow-green-200' : 'bg-slate-200'}`}></span>
                <span className={assemblyData ? 'text-green-700 font-medium' : 'text-slate-400'}>组装入库 {assemblyData ? '✓' : '可选'}</span>
              </div>
            </div>

            {/* 计算按钮 */}
            <div className="flex justify-center">
              <button
                onClick={calculate}
                disabled={processing || !canCalculate}
                className={`px-10 py-3.5 rounded-2xl text-white font-bold text-base transition-all duration-300 ${processing || !canCalculate ? 'bg-slate-300 cursor-not-allowed shadow-none' : 'shadow-xl shadow-blue-200 hover:shadow-2xl hover:shadow-blue-300 hover:-translate-y-0.5'}`}
                style={canCalculate && !processing ? {background:'linear-gradient(135deg,#3b82f6,#8b5cf6)'} : {}}
              >
                {processing ? (
                  <span className="flex items-center gap-2">
                    <svg className="animate-spin" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                    计算中...
                  </span>
                ) : (
                  <span className="flex items-center gap-2">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                    开始计算
                  </span>
                )}
              </button>
            </div>

            {!canCalculate && initialData && purchaseData && (
              <div className="text-center">
                <p className="text-sm text-amber-600 bg-amber-50 inline-flex items-center gap-1.5 px-4 py-2 rounded-full border border-amber-200">
                  ⚠️ 必选字段未完全匹配或单价/金额列至少需要一列，请检查列映射结果
                </p>
              </div>
            )}

            {/* 公式说明 */}
            <div className="bg-white/80 backdrop-blur-sm rounded-2xl border border-slate-200/60 p-6 card-shadow-lg">
              <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2 text-base">
                <span className="w-7 h-7 rounded-lg flex items-center justify-center" style={{background:'linear-gradient(135deg,#3b82f6,#8b5cf6)'}}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                </span>
                计算公式说明
              </h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm text-slate-600">
                <div className="bg-gradient-to-br from-blue-50 to-cyan-50 rounded-xl p-5 border border-blue-100/50">
                  <p className="font-semibold text-blue-800 mb-2">子件加权平均单价</p>
                  <div className="bg-white/80 rounded-lg p-3 mt-2 border border-blue-100/50">
                    <p className="font-mono text-sm text-blue-700">
                      = (期初库存金额 + 采购入库金额)<br/>
                      / (期初库存数量 + 采购入库数量)
                    </p>
                  </div>
                  <p className="text-xs text-blue-500/80 mt-2">💡 如有单价列：金额 = 单价 × 数量；如有金额列：直接使用金额</p>
                </div>
                <div className="bg-gradient-to-br from-amber-50 to-orange-50 rounded-xl p-5 border border-amber-100/50">
                  <p className="font-semibold text-amber-800 mb-2">父件加权平均单价</p>
                  <div className="bg-white/80 rounded-lg p-3 mt-2 border border-amber-100/50">
                    <p className="font-mono text-sm text-amber-700">
                      = (期初金额 + 采购金额 + 组装金额)<br/>
                      / (期初数量 + 采购数量 + 组装数量)
                    </p>
                  </div>
                  <p className="text-xs text-amber-500/80 mt-2">🔧 组装金额 = 组装数量 × Σ(子件加权平均单价 × 单件耗用量)</p>
                </div>
              </div>
            </div>
          </div>
        )}

        {activeTab === 'results' && results && stats && (
          <div className="fade-in space-y-6">
            {/* Stats Cards */}
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
              {[
                { label: 'SKU总数', value: stats.totalSKU, cls: 'stat-card-blue' },
                { label: '子件数', value: stats.childCount, cls: 'stat-card-cyan' },
                { label: '父件数', value: stats.parentCount, cls: 'stat-card-indigo' },
                { label: '期初金额', value: formatNum(stats.totalInit), cls: 'stat-card-emerald' },
                { label: '采购金额', value: formatNum(stats.totalPurch), cls: 'stat-card-amber' },
                { label: '组装金额', value: formatNum(stats.totalAssembly), cls: 'stat-card-rose' }
              ].map(({ label, value, cls }, i) => (
                <div key={i} className={`${cls} rounded-2xl p-4 card-shadow-lg`}>
                  <p className="text-xs text-white/70 mb-1">{label}</p>
                  <p className="text-2xl font-bold">{value}</p>
                </div>
              ))}
            </div>

            {/* Charts */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <div className="bg-white/80 backdrop-blur-sm rounded-2xl border border-slate-200/60 p-5 card-shadow-lg overflow-x-auto">
                <BarChart data={barChartData} width={Math.max(600, barChartData.length * 35)} height={320} title="Top 20 SKU 金额构成（期初/采购/组装）"/>
                <div className="flex justify-center gap-4 mt-2 text-xs text-slate-500">
                  <span className="flex items-center gap-1"><span className="w-3 h-3 rounded" style={{background:'linear-gradient(180deg,#93c5fd,#bfdbfe)'}}/>期初金额</span>
                  <span className="flex items-center gap-1"><span className="w-3 h-3 rounded" style={{background:'linear-gradient(180deg,#3b82f6,#60a5fa)'}}/>采购金额</span>
                  <span className="flex items-center gap-1"><span className="w-3 h-3 rounded" style={{background:'linear-gradient(180deg,#1e40af,#2563eb)'}}/>组装金额</span>
                </div>
              </div>
              <div className="bg-white/80 backdrop-blur-sm rounded-2xl border border-slate-200/60 p-5 card-shadow-lg">
                <DonutChart data={donutData} width={400} height={320} title="子件/父件金额占比"/>
              </div>
            </div>

            <div className="bg-white/80 backdrop-blur-sm rounded-2xl border border-slate-200/60 p-5 card-shadow-lg overflow-x-auto">
              <HBarChart data={rankData} width={Math.max(600, rankData.length > 0 ? 600 : 400)} height={Math.max(400, rankData.length * 24 + 60)} title="加权平均单价排行 Top 20"/>
            </div>

            {/* Detail Table */}
            <div className="bg-white/80 backdrop-blur-sm rounded-2xl border border-slate-200/60 card-shadow-lg overflow-hidden">
              <div className="px-5 py-4 border-b border-slate-100/80 flex items-center justify-between">
                <h3 className="font-bold text-slate-700 text-sm flex items-center gap-2">
                  <span className="w-6 h-6 rounded-md flex items-center justify-center" style={{background:'linear-gradient(135deg,#3b82f6,#8b5cf6)'}}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>
                  </span>
                  计算明细表
                </h3>
                <div className="flex items-center gap-3">
                  <span className="text-xs text-slate-400">共 {results.length} 条记录</span>
                  <button onClick={exportExcel} className="flex items-center gap-1.5 px-5 py-2.5 text-white text-xs font-semibold rounded-xl hover:shadow-lg hover:shadow-blue-200 transition-all duration-200" style={{background:'linear-gradient(135deg,#3b82f6,#8b5cf6)'}}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    导出 Excel
                  </button>
                </div>
              </div>
              <div className="overflow-x-auto max-h-[600px] overflow-y-auto">
                <table className="w-full text-sm">
                  <thead className="sticky top-0 z-10" style={{background:'linear-gradient(180deg,#f8fafc,#f1f5f9)'}}>
                    <tr>
                      {['SKU编码','SKU名称','类型','期初数量','期初金额','采购数量','采购金额','组装数量','组装金额','期末数量','期末金额','加权平均单价'].map((h, i) => (
                        <th key={i} className={`px-3 py-3 text-left text-xs font-bold text-slate-500 whitespace-nowrap ${i >= 3 ? 'text-right' : ''} border-b border-slate-200`}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100/80">
                    {results.map((r, i) => (
                      <tr key={i} className="table-row transition-colors duration-150">
                        <td className="px-3 py-2.5 text-slate-700 font-mono text-xs whitespace-nowrap">{r.code}</td>
                        <td className="px-3 py-2.5 text-slate-700 whitespace-nowrap max-w-[200px] truncate">{r.name}</td>
                        <td className="px-3 py-2.5">
                          <span className={`inline-flex px-2.5 py-0.5 rounded-full text-xs font-semibold ${r.type === '父件' ? 'bg-amber-100 text-amber-700' : 'bg-cyan-100 text-cyan-700'}`}>{r.type}</span>
                        </td>
                        <td className="px-3 py-2.5 text-right text-slate-600 tabular-nums">{r.initQty}</td>
                        <td className="px-3 py-2.5 text-right text-slate-600 tabular-nums">{formatMoney(r.initAmount)}</td>
                        <td className="px-3 py-2.5 text-right text-slate-600 tabular-nums">{r.purchQty}</td>
                        <td className="px-3 py-2.5 text-right text-slate-600 tabular-nums">{formatMoney(r.purchAmount)}</td>
                        <td className="px-3 py-2.5 text-right text-slate-600 tabular-nums">{r.assemblyQty}</td>
                        <td className="px-3 py-2.5 text-right text-slate-600 tabular-nums">{formatMoney(r.assemblyAmount)}</td>
                        <td className="px-3 py-2.5 text-right font-semibold text-slate-800 tabular-nums">{r.totalQty}</td>
                        <td className="px-3 py-2.5 text-right font-semibold text-slate-800 tabular-nums">{formatMoney(r.totalAmount)}</td>
                        <td className="px-3 py-2.5 text-right font-bold tabular-nums" style={{color:'#6366f1'}}>{r.weightedPrice.toFixed(4)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        )}
      </main>

      {/* Footer */}
      <footer className="border-t border-slate-200/60 bg-white/60 backdrop-blur-sm mt-8">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4 text-center text-xs text-slate-400">
          库存加权平均单价计算器 · 月末一次加权平均法 · 数据仅在本地浏览器处理，不上传至服务器
        </div>
      </footer>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
