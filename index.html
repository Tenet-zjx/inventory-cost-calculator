<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f3ee;--ink:#1a1a1a;--steel:#2c6e8f;--steel-dark:#1e5f7a;--steel-light:#d0e4ef;--forest:#1a7a4c;--forest-dark:#14603a;--forest-light:#cde8da;--rust:#8f4a2c;--rust-dark:#6e3820;--rust-light:#f0dccf;--paper:#faf8f4;--grid:#e8e4dc;--border:#d4cfc5;--muted:#8a8478;--dim:#b0a99d}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px;background-attachment:fixed}
.font-serif{font-family:'Noto Serif SC',serif!important}
.font-mono{font-family:'IBM Plex Mono',monospace!important}
.top-bar{height:3px;background:var(--ink)}
.card{background:#fff;border:1px solid var(--border);border-radius:2px;transition:border-color .2s}
.card:hover{border-color:#b0a99d}
.upload-zone{border:1.5px dashed var(--border);border-radius:2px;transition:all .25s ease;cursor:pointer}
.upload-zone:hover{border-color:var(--muted);background:rgba(0,0,0,.01)}
.upload-zone.drag-over{border-style:solid}
.upload-zone.zone-initial.drag-over{border-color:var(--steel);background:var(--steel-light)}
.upload-zone.zone-purchase.drag-over{border-color:var(--forest);background:var(--forest-light)}
.upload-zone.zone-assembly.drag-over{border-color:var(--rust);background:var(--rust-light)}
.upload-zone.has-file{border-style:solid;border-width:1px}
.upload-zone.zone-initial.has-file{border-color:var(--steel);background:rgba(44,110,143,.03)}
.upload-zone.zone-purchase.has-file{border-color:var(--forest);background:rgba(26,122,76,.03)}
.upload-zone.zone-assembly.has-file{border-color:var(--rust);background:rgba(143,74,44,.03)}
.field-required{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;font-size:10px;padding:1px 5px;border-radius:1px;font-family:'IBM Plex Mono',monospace}
.field-optional{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;font-size:10px;padding:1px 5px;border-radius:1px;font-family:'IBM Plex Mono',monospace}
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.progress-track{background:var(--grid);height:6px;overflow:hidden}
.progress-fill{height:100%;transition:width .3s ease}
.progress-fill-steel{background:var(--steel)}
.progress-fill-forest{background:var(--forest)}
.progress-fill-rust{background:var(--rust)}
.progress-fill-ink{background:var(--ink)}
.stat-block{padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.stat-block .stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.7;font-family:'IBM Plex Mono',monospace}
.stat-block .stat-value{font-size:22px;font-weight:700;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.stat-steel{background:var(--steel);color:#fff}
.stat-forest{background:var(--forest);color:#fff}
.stat-rust{background:var(--rust);color:#fff}
.stat-ink{background:var(--ink);color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:'IBM Plex Mono',monospace;padding:8px 10px;border-bottom:2px solid var(--ink);font-weight:600;white-space:nowrap}
.tbl th.num{text-align:right}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--grid);font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.tbl td.num{text-align:right}
.tbl tr:nth-child(even) td{background:var(--paper)}
.tbl tr:hover td{background:var(--steel-light)!important}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 20px;font-size:13px;font-weight:600;border:1px solid var(--border);border-radius:1px;cursor:pointer;transition:all .15s ease;font-family:'Noto Sans SC',sans-serif}
.btn-primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn-primary:hover{background:#333}
.btn-primary:disabled{background:#999;cursor:not-allowed;border-color:#999}
.btn-outline{background:transparent;color:var(--ink)}
.btn-outline:hover{background:var(--paper)}
.tab-btn{padding:8px 18px;font-size:13px;font-weight:600;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s;background:transparent;color:var(--muted);font-family:'Noto Sans SC',sans-serif}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--ink)}
.tab-btn:hover:not(.active){color:var(--ink)}
.remove-btn{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:1px;border:1px solid transparent;cursor:pointer;transition:all .15s;background:transparent;color:var(--muted)}
.remove-btn:hover{border-color:#dc2626;color:#dc2626;background:#fef2f2}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:0}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>

<script type="text/babel">
const{useState,useRef,useCallback,useMemo,useEffect,Fragment}=React;
const WORKER_CODE="importScripts('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js');\nconst DB_NAME='inventory_calculator_db',DB_VER=1;\nfunction openDB(){return new Promise((r,j)=>{const q=indexedDB.open(DB_NAME,DB_VER);q.onupgradeneeded=(e)=>{const d=e.target.result;if(!d.objectStoreNames.contains('initial')){const s=d.createObjectStore('initial',{keyPath:'id',autoIncrement:true});s.createIndex('skuCode','skuCode',{unique:false});}if(!d.objectStoreNames.contains('purchase')){const s=d.createObjectStore('purchase',{keyPath:'id',autoIncrement:true});s.createIndex('skuCode','skuCode',{unique:false});}if(!d.objectStoreNames.contains('assembly')){const s=d.createObjectStore('assembly',{keyPath:'id',autoIncrement:true});s.createIndex('parentCode','parentCode',{unique:false});s.createIndex('workOrderNo','workOrderNo',{unique:false});}if(!d.objectStoreNames.contains('results')){d.createObjectStore('results',{keyPath:'code'});}};q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error);});}\nasync function bulkPut(sn,recs){const d=await openDB();return new Promise((r,j)=>{const t=d.transaction(sn,'readwrite');const s=t.objectStore(sn);for(const c of recs)s.put(c);t.oncomplete=()=>{d.close();r();};t.onerror=()=>{d.close();j(t.error);};});}\nasync function clearStore(sn){const d=await openDB();return new Promise((r,j)=>{const t=d.transaction(sn,'readwrite');t.objectStore(sn).clear();t.oncomplete=()=>{d.close();r();};t.onerror=()=>{d.close();j(t.error);};});}\nasync function getAll(sn){const d=await openDB();return new Promise((r,j)=>{const t=d.transaction(sn,'readonly');const q=t.objectStore(sn).getAll();q.onsuccess=()=>{d.close();r(q.result);};q.onerror=()=>{d.close();j(q.error);};});}\nfunction numVal(v){if(v===null||v===undefined||v==='')return 0;const n=Number(v);return isNaN(n)?0:n;}\nconst COL_PATTERNS={\"initial\":{\"skuCode\":{\"patterns\":[\"SKU编码\",\"SKU代码\",\"SKU号\",\"物料编码\",\"物料代码\",\"物料号\",\"商品编码\",\"商品代码\",\"sku编码\",\"sku代码\",\"SKU\",\"skucode\",\"物料编号\",\"存货编码\",\"货号\",\"品号\"],\"required\":true,\"label\":\"SKU编码\",\"group\":\"basic\"},\"skuName\":{\"patterns\":[\"SKU名称\",\"物料名称\",\"商品名称\",\"sku名称\",\"品名\",\"名称\",\"存货名称\",\"物料描述\",\"品名规格\",\"货品名称\"],\"required\":false,\"label\":\"SKU名称\",\"group\":\"basic\"},\"skuType\":{\"patterns\":[\"SKU类型\",\"物料类型\",\"商品类型\",\"sku类型\",\"类型\",\"存货类别\",\"物料属性\",\"分类\",\"品类\"],\"required\":false,\"label\":\"SKU类型\",\"group\":\"basic\"},\"qty\":{\"patterns\":[\"期初数量\",\"期初库存数量\",\"期初数\",\"初数量\",\"初始数量\",\"opening_qty\",\"begin_qty\",\"数量\",\"库存数量\",\"结存数量\",\"期末数量\",\"收货数量\",\"到货数量\",\"入库数量\",\"期初结存数量\",\"初存数量\",\"月初数量\"],\"required\":true,\"label\":\"数量\",\"group\":\"amount\"},\"price\":{\"patterns\":[\"期初单价\",\"期初库存单价\",\"期初价格\",\"初单价\",\"初始单价\",\"opening_price\",\"begin_price\",\"单价\",\"单位成本\",\"不含税单价\",\"含税单价\",\"成本单价\",\"采购单价\",\"入库单价\",\"标准单价\",\"标准成本\",\"单位价格\"],\"required\":false,\"label\":\"单价\",\"group\":\"amount\"},\"amount\":{\"patterns\":[\"期初金额\",\"期初库存金额\",\"期初价值\",\"初金额\",\"初始金额\",\"opening_amount\",\"begin_amount\",\"金额\",\"总金额\",\"价税合计\",\"不含税金额\",\"含税金额\",\"成本金额\",\"总价\",\"总计\",\"货款\",\"价税合计金额\",\"总额\",\"期初总金额\"],\"required\":false,\"label\":\"金额\",\"group\":\"amount\"}},\"purchase\":{\"skuCode\":{\"patterns\":[\"SKU编码\",\"SKU代码\",\"SKU号\",\"物料编码\",\"物料代码\",\"物料号\",\"商品编码\",\"商品代码\",\"sku编码\",\"sku代码\",\"SKU\",\"skucode\",\"物料编号\",\"存货编码\",\"货号\",\"品号\"],\"required\":true,\"label\":\"SKU编码\",\"group\":\"basic\"},\"skuName\":{\"patterns\":[\"SKU名称\",\"物料名称\",\"商品名称\",\"sku名称\",\"品名\",\"名称\",\"存货名称\",\"物料描述\",\"品名规格\",\"货品名称\"],\"required\":false,\"label\":\"SKU名称\",\"group\":\"basic\"},\"skuType\":{\"patterns\":[\"SKU类型\",\"物料类型\",\"商品类型\",\"sku类型\",\"类型\",\"存货类别\",\"物料属性\",\"分类\",\"品类\"],\"required\":false,\"label\":\"SKU类型\",\"group\":\"basic\"},\"qty\":{\"patterns\":[\"采购数量\",\"采购入库数量\",\"采购数\",\"入库数量\",\"入库数\",\"purchase_qty\",\"采购量\",\"数量\",\"收货数量\",\"到货数量\",\"进货数量\",\"收货量\",\"进货量\",\"订货数量\"],\"required\":true,\"label\":\"数量\",\"group\":\"amount\"},\"price\":{\"patterns\":[\"采购单价\",\"采购入库单价\",\"采购价格\",\"入库单价\",\"purchase_price\",\"采购价\",\"单价\",\"单位成本\",\"不含税单价\",\"含税单价\",\"成本单价\",\"进价\",\"进货单价\",\"标准单价\",\"标准成本\",\"单位价格\"],\"required\":false,\"label\":\"单价\",\"group\":\"amount\"},\"amount\":{\"patterns\":[\"采购金额\",\"采购入库金额\",\"采购价值\",\"入库金额\",\"purchase_amount\",\"采购额\",\"金额\",\"总金额\",\"价税合计\",\"不含税金额\",\"含税金额\",\"成本金额\",\"总价\",\"总计\",\"货款\",\"价税合计金额\",\"总额\",\"采购总金额\"],\"required\":false,\"label\":\"金额\",\"group\":\"amount\"}},\"assembly\":{\"workOrderNo\":{\"patterns\":[\"加工单号\",\"工单号\",\"生产单号\",\"委外单号\",\"订单号\",\"加工单\",\"工单\",\"work_order\",\"workorder\",\"order_no\"],\"required\":true,\"label\":\"加工单号\",\"group\":\"order\"},\"parentCode\":{\"patterns\":[\"SKU(父件)\",\"父件SKU\",\"父件编码\",\"父件SKU编码\",\"父件代码\",\"父件物料编码\",\"父件号\",\"父SKU\",\"parent_sku\",\"成品编码\",\"成品SKU\",\"成品代码\",\"产品编码\",\"产品SKU\",\"主件编码\",\"主件SKU\"],\"required\":true,\"label\":\"SKU(父件)\",\"group\":\"parent\"},\"parentName\":{\"patterns\":[\"父件名称\",\"父件SKU名称\",\"父件品名\",\"父名称\",\"parent_name\",\"成品名称\",\"产品名称\",\"主件名称\"],\"required\":false,\"label\":\"父件名称\",\"group\":\"parent\"},\"processQty\":{\"patterns\":[\"加工量\",\"加工数量\",\"生产数量\",\"产出数量\",\"完工数量\",\"组装数量\",\"组装入库数量\",\"组装数\",\"装配数量\",\"assembly_qty\",\"组合数量\",\"成品数量\"],\"required\":true,\"label\":\"加工量\",\"group\":\"parent\"},\"childCode\":{\"patterns\":[\"SKU(子件)\",\"子件SKU\",\"子件编码\",\"子件SKU编码\",\"子件代码\",\"子件物料编码\",\"子件号\",\"子SKU\",\"child_sku\",\"原料编码\",\"原料SKU\",\"零件编码\",\"零件SKU\",\"配件编码\",\"配件SKU\",\"组件编码\"],\"required\":true,\"label\":\"SKU(子件)\",\"group\":\"child\"},\"childName\":{\"patterns\":[\"子件名称\",\"子件SKU名称\",\"子件品名\",\"子名称\",\"child_name\",\"原料名称\",\"零件名称\",\"配件名称\",\"组件名称\"],\"required\":false,\"label\":\"子件名称\",\"group\":\"child\"},\"childRatio\":{\"patterns\":[\"子件配比\",\"配比\",\"用量\",\"BOM用量\",\"单件耗用量\",\"单件用量\",\"单位耗用量\",\"耗用量\",\"unit_usage\",\"单位用量\",\"定额\",\"定额用量\",\"BOM定额\",\"标准用量\",\"耗用\"],\"required\":true,\"label\":\"子件配比\",\"group\":\"child\"}}};const GROUP_RULES={\"initial\":{\"amount\":{\"requireOneOf\":[\"price\",\"amount\"],\"message\":\"单价和金额至少需要匹配一列\"}},\"purchase\":{\"amount\":{\"requireOneOf\":[\"price\",\"amount\"],\"message\":\"单价和金额至少需要匹配一列\"}},\"assembly\":{}};\nfunction matchColumn(h,p){const r={};const u=new Set();for(const k of Object.keys(p)){const a=p[k].patterns;for(const t of a){const i=h.findIndex((x,j)=>!u.has(j)&&x&&x.toString().trim().replace(/\\s+/g,'')===t.replace(/\\s+/g,''));if(i!==-1){r[k]=i;u.add(i);break;}}if(r[k]===undefined){for(const t of a){const i=h.findIndex((x,j)=>!u.has(j)&&x&&x.toString().trim().includes(t.replace(/\\s+/g,'')));if(i!==-1){r[k]=i;u.add(i);break;}}}}return r;}\nfunction validateMapping(c,t){const p=COL_PATTERNS[t];const issues=[];const missing={};for(const k of Object.keys(p)){if(p[k].required&&c[k]===undefined){issues.push({key:k,label:p[k].label,severity:'error',message:'\\u5fc5\\u9009\\u5b57\\u6bb5\\u201c'+p[k].label+'\\u201d\\u672a\\u5339\\u914d'});missing[k]=true;}}const rules=GROUP_RULES[t];for(const[g,rule]of Object.entries(rules||{})){if(rule.requireOneOf){const a=rule.requireOneOf.some(k=>c[k]!==undefined);if(!a){issues.push({key:g,label:rule.requireOneOf.map(k=>p[k].label).join('/'),severity:'warning',message:rule.message});rule.requireOneOf.forEach(k=>{if(c[k]===undefined)missing[k]=true;});}}}return{issues,missing};}\nself.onmessage=async function(e){const m=e.data;try{if(m.type==='parse')await handleParse(m);else if(m.type==='compute')await handleCompute();}catch(err){self.postMessage({type:'error',message:err.message||String(err)});}};\nasync function handleParse(msg){const{tableType,fileName,buffer}=msg;const wb=XLSX.read(buffer,{type:'array'});let ts=null;const sn=wb.SheetNames;const km={initial:/\\u671f\\u521d|\\u521d\\u59cb|opening|initial|begin/i,purchase:/\\u91c7\\u8d2d|purchase|buy|procure/i,assembly:/\\u7ec4\\u88c5|\\u88c5\\u914d|assembly|bom|\\u7ec4\\u5408/i};for(const s of sn){if(km[tableType].test(s)){ts=s;break;}}if(!ts){for(const s of sn){const w=wb.S const BarChart=({data,width,height,title})=>{
  if(!data||data.length===0)return null;const m={top:28,right:16,bottom:52,left:60};const cw=width-m.left-m.right;const ch=height-m.top-m.bottom;const mv=Math.max(...data.map(d=>d.initial+d.purchase+d.assembly),1);const bw=Math.min(24,(cw/data.length)*0.65);const gap=cw/data.length;
  return(<svg width={width} height={height} viewBox={`0 0 ${width} ${height}`}><text x={width/2} y={16} textAnchor="middle" fontSize={11} fontWeight={600} fill="#1a1a1a" fontFamily="'Noto Sans SC'">{title}</text>{data.map((d,i)=>{const x=m.left+i*gap+gap/2-bw/2;const hI=(d.initial/mv)*ch;const hP=(d.purchase/mv)*ch;const hA=(d.assembly/mv)*ch;const bY=m.top+ch;return(<g key={i}><rect x={x} y={bY-hI-hP-hA} width={bw} height={hA} fill="#1a4a60"/><rect x={x} y={bY-hI-hP} width={bw} height={hP} fill="#2c6e8f"/><rect x={x} y={bY-hI} width={bw} height={hI} fill="#b0cfe0"/><text x={x+bw/2} y={bY+12} textAnchor="middle" fontSize={7} fill="#8a8478" transform={`rotate(-45,${x+bw/2},${bY+12})`}>{d.label.length>8?d.label.slice(0,8)+'…':d.label}</text></g>);})}{[0,.25,.5,.75,1].map((p,i)=>{const y=m.top+ch*(1-p);const v=mv*p;return <g key={i}><line x1={m.left} y1={y} x2={m.left+cw} y2={y} stroke="#e8e4dc" strokeDasharray={i===0?"":"3,3"}/><text x={m.left-4} y={y+3} textAnchor="end" fontSize={8} fill="#8a8478" fontFamily="'IBM Plex Mono'">{v>=10000?(v/10000).toFixed(1)+'万':v.toFixed(0)}</text></g>;})}<line x1={m.left} y1={m.top+ch} x2={m.left+cw} y2={m.top+ch} stroke="#d4cfc5"/></svg>);
};
const DonutChart=({data,width,height,title})=>{
  if(!data||data.length===0)return null;const cx=width/2,cy=height/2+10;const oR=Math.min(width,height)/2-28;const iR=oR*0.55;const total=data.reduce((s,d)=>s+d.value,0)||1;const colors=['#2c6e8f','#1a7a4c','#8f4a2c','#1a1a1a','#b0a99d'];let sa=-Math.PI/2;const slices=data.map((d,i)=>{const a=(d.value/total)*2*Math.PI;const sl={...d,startAngle:sa,endAngle:sa+a,color:colors[i%colors.length],pct:((d.value/total)*100).toFixed(1)};sa+=a;return sl;});const arc=(s,e,r)=>{const l=e-s>Math.PI?1:0;return`M${cx+r*Math.cos(s)},${cy+r*Math.sin(s)} A${r},${r} 0 ${l} 1 ${cx+r*Math.cos(e)},${cy+r*Math.sin(e)}`;};
  return(<svg width={width} height={height} viewBox={`0 0 ${width} ${height}`}><text x={width/2} y={16} textAnchor="middle" fontSize={11} fontWeight={600} fill="#1a1a1a" fontFamily="'Noto Sans SC'">{title}</text>{slices.map((sl,i)=>{const path=arc(sl.startAngle,sl.endAngle,oR)+' L'+`${cx+iR*Math.cos(sl.endAngle)},${cy+iR*Math.sin(sl.endAngle)}`+` A${iR},${iR} 0 ${sl.endAngle-sl.startAngle>Math.PI?1:0} 0 ${cx+iR*Math.cos(sl.startAngle)},${cy+iR*Math.sin(sl.startAngle)}`+' Z';return <path key={i} d={path} fill={sl.color} opacity={0.85}/>;})}<text x={cx} y={cy-5} textAnchor="middle" fontSize={13} fontWeight={700} fill="#1a1a1a" fontFamily="'IBM Plex Mono'">{total>=10000?(total/10000).toFixed(1)+'万':total.toFixed(0)}</text><text x={cx} y={cy+9} textAnchor="middle" fontSize={8} fill="#8a8478" fontFamily="'IBM Plex Mono'">合计金额</text>{slices.map((sl,i)=>(<g key={i}><rect x={8} y={height-36+i*16} width={8} height={8} fill={sl.color}/><text x={20} y={height-29+i*16} fontSize={9} fill="#1a1a1a" fontFamily="'IBM Plex Mono'">{sl.label} {sl.pct}%</text></g>))}</svg>);
};
const HBarChart=({data,width,height,title})=>{
  if(!data||data.length===0)return null;const m={top:28,right:24,bottom:8,left:90};const cw=width-m.left-m.right;const ch=height-m.top-m.bottom;const mv=Math.max(...data.map(d=>d.value),1);const bh=Math.min(14,(ch/data.length)*0.7);const gap=ch/data.length;
  return(<svg width={width} height={height} viewBox={`0 0 ${width} ${height}`}><text x={width/2} y={16} textAnchor="middle" fontSize={11} fontWeight={600} fill="#1a1a1a" fontFamily="'Noto Sans SC'">{title}</text>{data.map((d,i)=>{const y=m.top+i*gap+gap/2-bh/2;const bw=(d.value/mv)*cw;return(<g key={i}><text x={m.left-4} y={y+bh/2+3} textAnchor="end" fontSize={8} fill="#1a1a1a" fontFamily="'IBM Plex Mono'">{d.label.length>10?d.label.slice(0,10)+'…':d.label}</text><rect x={m.left} y={y} width={bw} height={bh} fill={i<3?'#1a1a1a':'#2c6e8f'}/><text x={m.left+bw+4} y={y+bh/2+3} fontSize={8} fill="#8a8478" fontFamily="'IBM Plex Mono'">{d.value.toFixed(2)}</text></g>);})}</svg>);
};

const App=()=>{
  const[initialData,setInitialData]=useState(null);const[purchaseData,setPurchaseData]=useState(null);const[assemblyData,setAssemblyData]=useState(null);
  const[results,setResults]=useState(null);const[stats,setStats]=useState(null);const[activeTab,setActiveTab]=useState('upload');
  const[processing,setProcessing]=useState(false);const[errors,setErrors]=useState([]);const[parseProgress,setParseProgress]=useState({});
  const[computeProgress,setComputeProgress]=useState(null);const[page,setPage]=useState(0);const PAGE_SIZE=100;const workerRef=useRef(null);
  useEffect(()=>{
    const w=createWorker();w.onmessage=(e)=>{const msg=e.data;
      if(msg.type==='parsed'){setParseProgress(prev=>({...prev,[msg.tableType]:null}));const fd={headers:msg.headers,colMap:msg.colMap,validation:msg.validation,sheetName:msg.sheetName,fileName:msg.fileName||'',rowCount:msg.rowCount};if(msg.tableType==='initial')setInitialData(fd);else if(msg.tableType==='purchase')setPurchaseData(fd);else if(msg.tableType==='assembly')setAssemblyData(fd);}
      else if(msg.type==='parse_progress'){setParseProgress(prev=>({...prev,[msg.tableType]:{current:msg.current,total:msg.total}}));}
      else if(msg.type==='compute_progress'){setComputeProgress(msg);}
      else if(msg.type==='computed'){setResults(msg.results);setStats(msg.stats);setProcessing(false);setComputeProgress(null);setActiveTab('results');}
      else if(msg.type==='error'){setErrors([msg.message]);setProcessing(false);setComputeProgress(null);}
    };workerRef.current=w;return()=>w.terminate();
  },[]);
  const handleRemove=useCallback((tt)=>()=>{if(tt==='initial')setInitialData(null);else if(tt==='purchase')setPurchaseData(null);else if(tt==='assembly')setAssemblyData(null);},[]);
  const canCalculate=useMemo(()=>{if(!initialData||!purchaseData)return false;const iv=validateMapping(initialData.colMap,'initial');const pv=validateMapping(purchaseData.colMap,'purchase');return!iv.issues.some(i=>i.severity==='error')&&!pv.issues.some(i=>i.severity==='error')&&(initialData.colMap.price!==undefined||initialData.colMap.amount!==undefined)&&(purchaseData.colMap.price!==undefined||purchaseData.colMap.amount!==undefined);},[initialData,purchaseData]);
  const calculate=useCallback(()=>{if(!workerRef.current)return;setProcessing(true);setErrors([]);setComputeProgress(null);workerRef.current.postMessage({type:'compute'});},[]);
  const exportExcel=useCallback(()=>{if(!results)return;const wsData=[['SKU编码','SKU名称','SKU类型','期初数量','期初金额','采购数量','采购金额','组装数量','组装金额','期末总数量','期末总金额','加权平均单价'],...results.map(r=>[r.code,r.name,r.type,r.initQty,r.initAmount,r.purchQty,r.purchAmount,r.assemblyQty,r.assemblyAmount,r.totalQty,r.totalAmount,r.weightedPrice])];const ws=XLSX.utils.aoa_to_sheet(wsData);ws['!cols']=[{wch:15},{wch:20},{wch:8},{wch:12},{wch:14},{wch:12},{wch:14},{wch:12},{wch:14},{wch:12},{wch:14},{wch:14}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'期末库存加权平均单价');XLSX.writeFile(wb,'期末库存加权平均单价.xlsx');},[results]);
  const formatNum=(n)=>{if(Math.abs(n)>=10000)return(n/10000).toFixed(2)+'万';return n.toFixed(2);};
  const formatMoney=(n)=>n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  const barChartData=useMemo(()=>{if(!results)return[];return[...results].sort((a,b)=>(b.initAmount+b.purchAmount+b.assemblyAmount)-(a.initAmount+a.purchAmount+a.assemblyAmount)).slice(0,20).map(r=>({label:r.name||r.code,initial:r.initAmount,purchase:r.purchAmount,assembly:r.assemblyAmount}));},[results]);
  const donutData=useMemo(()=>{if(!stats)return[];return[{label:'子件金额',value:stats.childAmount},{label:'父件金额',value:stats.parentAmount}];},[stats]);
  const rankData=useMemo(()=>{if(!results)return[];return[...results].sort((a,b)=>b.weightedPrice-a.weightedPrice).slice(0,20).map(r=>({label:r.name||r.code,value:r.weightedPrice}));},[results]);
  const totalPages=results?Math.ceil(results.length/PAGE_SIZE):0;const pagedResults=results?results.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE):[];
  return(
    <div className="min-h-screen" style={{background:'var(--bg)',backgroundImage:'linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px)',backgroundSize:'40px 40px',backgroundAttachment:'fixed'}}>
      <div className="top-bar"/>
      <header className="bg-white/90 backdrop-blur-sm border-b border-[var(--border)] sticky top-0 z-50">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-8 h-8 flex items-center justify-center bg-[var(--ink)]"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2"><rect x="2" y="3" width="20" height="14" rx="1"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></div>
            <div><h1 className="text-base font-bold font-serif text-[var(--ink)]">库存加权平均单价计算器</h1><p className="text-[10px] font-mono text-[var(--muted)]">月末一次加权平均法 · Worker + IndexedDB · 先子件后父件</p></div>
          </div>
          <div className="flex gap-0 border border-[var(--border)]">
            <button onClick={()=>setActiveTab('upload')} className={`tab-btn ${activeTab==='upload'?'active':''}`}>数据导入</button>
            <button onClick={()=>results&&setActiveTab('results')} className={`tab-btn ${activeTab==='results'?'active':''} ${!results?'opacity-30 cursor-not-allowed':''}`}>计算结果</button>
          </div>
        </div>
      </header>
      <main className="max-w-7xl mx-auto px-4 sm:px-6 py-5">
        {errors.length>0&&(<div className="mb-4 bg-red-50 border border-red-200 p-3 fade-in">{errors.map((err,i)=><p key={i} className="text-red-700 text-xs font-mono">⛔ {err}</p>)}<button onClick={()=>setErrors([])} className="mt-1 text-[10px] text-red-400 hover:text-red-600 font-mono">关闭</button></div>)}
        {activeTab==='upload'&&(
          <div className="fade-in space-y-5">
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
              <UploadZone tableType="initial" zoneClass="zone-initial" title="期初库存表" subtitle="数量+单价/金额" accentKey="steel" data={initialData} onRemove={handleRemove('initial')} workerRef={workerRef} progressMap={parseProgress}/>
              <UploadZone tableType="purchase" zoneClass="zone-purchase" title="采购入库表" subtitle="数量+单价/金额" accentKey="forest" data={purchaseData} onRemove={handleRemove('purchase')} workerRef={workerRef} progressMap={parseProgress}/>
              <UploadZone tableType="assembly" zoneClass="zone-assembly" title="组装入库表" subtitle="加工单号+配比" accentKey="rust" data={assemblyData} onRemove={handleRemove('assembly')} workerRef={workerRef} progressMap={parseProgress}/>
            </div>
            <div className="flex items-center justify-center gap-5 text-xs font-mono">
              <span className={initialData?'text-[var(--steel)]':'text-[var(--dim)]'}>期初 {initialData?'✓':'—'}</span>
              <span className={purchaseData?'text-[var(--forest)]':'text-[var(--dim)]'}>采购 {purchaseData?'✓':'—'}</span>
              <span className={assemblyData?'text-[var(--rust)]':'text-[var(--dim)]'}>组装 {assemblyData?'✓':'可选'}</span>
            </div>
            <div className="flex justify-center"><button onClick={calculate} disabled={processing||!canCalculate} className="btn btn-primary">{processing?<span className="flex items-center gap-2"><svg className="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>计算中...</span>:<span className="flex items-center gap-2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>开始计算</span>}</button></div>
            {computeProgress&&(<div className="max-w-md mx-auto space-y-1.5 fade-in"><div className="flex items-center justify-between text-[10px] font-mono text-[var(--muted)]"><span>{computeProgress.stage==='reading'?'读取 IndexedDB...':computeProgress.stage==='computing'?'加权平均计算...':'写入结果...'}</span><span>{computeProgress.current}/{computeProgress.total}</span></div><div className="progress-track"><div className="progress-fill progress-fill-ink" style={{width:(computeProgress.current/computeProgress.total*100)+'%'}}/></div></div>)}
            {!canCalculate&&initialData&&purchaseData&&(<p className="text-center text-xs text-amber-700 bg-amber-50 inline-flex items-center gap-1 px-3 py-1.5 border border-amber-200">⚠️ 必选字段未完全匹配或单价/金额列至少需要一列</p>)}
            <div className="card p-5">
              <h3 className="font-bold font-serif text-[var(--ink)] mb-3 flex items-center gap-2 text-sm"><span className="w-5 h-5 flex items-center justify-center bg-[var(--ink)] text-white text-[10px] font-mono">?</span>计算公式说明</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-[var(--ink)]">
                <div className="bg-[var(--steel-light)] p-4 border-l-2 border-[var(--steel)]"><p className="font-semibold mb-1.5">子件加权平均单价</p><p className="font-mono text-[11px] bg-white/60 p-2 border border-[var(--border)]">= (期初金额 + 采购金额) / (期初数量 + 采购数量)</p></div>
                <div className="bg-[var(--rust-light)] p-4 border-l-2 border-[var(--rust)]"><p className="font-semibold mb-1.5">父件加权平均单价</p><p className="font-mono text-[11px] bg-white/60 p-2 border border-[var(--border)]">= (期初金额 + 采购金额 + 组装金额) / (期初数量 + 采购数量 + 组装数量)</p><p className="text-[10px] text-[var(--rust-dark)] mt-1.5 font-mono">组装金额 = Σ_加工单号(加工量 × Σ(子件单价 × 子件配比))</p></div>
              </div>
            </div>
          </div>
        )}
        {activeTab==='results'&&results&&stats&&(
          <div className="fade-in space-y-5">
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">
              <div className="stat-block stat-ink"><span className="stat-label">SKU总数</span><span className="stat-value">{stats.totalSKU}</span></div>
              <div className="stat-block stat-steel"><span className="stat-label">子件数</span><span className="stat-value">{stats.childCount}</span></div>
              <div className="stat-block stat-rust"><span className="stat-label">父件数</span><span className="stat-value">{stats.parentCount}</span></div>
              <div className="stat-block stat-steel"><span className="stat-label">期初金额</span><span className="stat-value">{formatNum(stats.totalInit)}</span></div>
              <div className="stat-block stat-forest"><span className="stat-label">采购金额</span><span className="stat-value">{formatNum(stats.totalPurch)}</span></div>
              <div className="stat-block stat-rust"><span className="stat-label">组装金额</span><span className="stat-value">{formatNum(stats.totalAssembly)}</span></div>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <div className="card p-4 overflow-x-auto"><BarChart data={barChartData} width={Math.max(560,barChartData.length*30)} height={300} title="Top 20 SKU 金额构成"/><div className="flex justify-center gap-4 mt-2 text-[10px] font-mono text-[var(--muted)]"><span className="flex items-center gap-1"><span className="inline-block w-3 h-2" style={{background:'#b0cfe0'}}/>期初</span><span className="flex items-center gap-1"><span className="inline-block w-3 h-2" style={{background:'#2c6e8f'}}/>采购</span><span className="flex items-center gap-1"><span className="inline-block w-3 h-2" style={{background:'#1a4a60'}}/>组装</span></div></div>
              <div className="card p-4"><DonutChart data={donutData} width={380} height={300} title="子件/父件金额占比"/></div>
            </div>
            <div className="card p-4 overflow-x-auto"><HBarChart data={rankData} width={560} height={Math.max(360,rankData.length*22+50)} title="加权平均单价排行 Top 20"/></div>
            <div className="card overflow-hidden">
              <div className="px-4 py-3 border-b border-[var(--grid)] flex items-center justify-between flex-wrap gap-2">
                <h3 className="font-bold font-serif text-sm">计算明细表</h3>
                <div className="flex items-center gap-3">
                  <span className="text-[10px] font-mono text-[var(--muted)]">{results.length} 条</span>
                  {totalPages>1&&(<div className="flex items-center gap-1"><button onClick={()=>setPage(Math.max(0,page-1))} disabled={page===0} className="btn btn-outline text-[10px] px-2 py-1" style={{fontSize:10}}>上一页</button><span className="text-[10px] font-mono text-[var(--muted)]">{page+1}/{totalPages}</span><button onClick={()=>setPage(Math.min(totalPages-1,page+1))} disabled={page>=totalPages-1} className="btn btn-outline text-[10px] px-2 py-1" style={{fontSize:10}}>下一页</button></div>)}
                  <button onClick={exportExcel} className="btn btn-primary text-[11px] px-3 py-1.5"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>导出 Excel</button>
                </div>
              </div>
              <div className="overflow-x-auto max-h-[560px] overflow-y-auto">
                <table className="tbl">
                  <thead className="sticky top-0 z-10 bg-[var(--paper)]"><tr>{['SKU编码','SKU名称','类型','期初数量','期初金额','采购数量','采购金额','组装数量','组装金额','期末数量','期末金额','加权平均单价'].map((h,i)=>(<th key={i} className={i>=3?'num':''}>{h}</th>))}</tr></thead>
                  <tbody>{pagedResults.map((r,i)=>(<tr key={i}><td>{r.code}</td><td className="max-w-[160px] truncate">{r.name}</td><td><span className={`text-[10px] font-mono px-1.5 py-0.5 border ${r.type==='父件'?'bg-[var(--rust-light)] text-[var(--rust-dark)] border-[var(--rust)]':'bg-[var(--steel-light)] text-[var(--steel-dark)] border-[var(--steel)]'}`}>{r.type}</span></td><td className="num">{r.initQty}</td><td className="num">{formatMoney(r.initAmount)}</td><td className="num">{r.purchQty}</td><td className="num">{formatMoney(r.purchAmount)}</td><td className="num">{r.assemblyQty}</td><td className="num">{formatMoney(r.assemblyAmount)}</td><td className="num font-semibold">{r.totalQty}</td><td className="num font-semibold">{formatMoney(r.totalAmount)}</td><td className="num font-bold" style={{color:'var(--steel)'}}>{r.weightedPrice.toFixed(4)}</td></tr>))}</tbody>
                </table>
              </div>
            </div>
          </div>
        )}
      </main>
      <footer className="border-t border-[var(--border)] bg-white/60 mt-6"><div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 text-center text-[10px] font-mono text-[var(--dim)]">库存加权平均单价计算器 v3 · Web Worker + IndexedDB · 数据仅在本地浏览器处理</div></footer>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
